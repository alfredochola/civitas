<div class="lightbox-overlay d-flex flex-column justify-content-center align-items-center" (click)="close.emit()">
  <!-- Top Bar Controls -->
  <div class="lightbox-top-bar d-flex align-items-center gap-2 gap-sm-3">
    <button class="btn-top-download d-flex align-items-center gap-2" 
            (click)="downloadCurrent($event)" 
            [disabled]="isDownloading"
            title="Download watermarked high-res photo"
            aria-label="Download photo">
      <span *ngIf="isDownloading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      <i *ngIf="!isDownloading" class="bi bi-download"></i>
      <span class="d-none d-sm-inline">{{ isDownloading ? 'Preparing...' : 'Download Watermarked' }}</span>
    </button>

    <button class="btn-close-lightbox" (click)="close.emit(); $event.stopPropagation()" aria-label="Close">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <!-- Main Image Container -->
  <div class="lightbox-content-container d-flex align-items-center justify-content-center" (click)="$event.stopPropagation()">
    <!-- Prev Button -->
    <button class="btn-nav btn-prev" (click)="prev()" aria-label="Previous image">
      <i class="bi bi-chevron-left"></i>
    </button>

    <!-- Main Image Wrapper -->
    <div class="image-wrapper d-flex flex-column align-items-center justify-content-center position-relative" style="min-height: 400px; min-width: 300px;">
      <!-- Loading Spinner inside Lightbox -->
      <div *ngIf="imageLoading" class="lightbox-spinner position-absolute d-flex align-items-center justify-content-center" style="z-index: 10;">
        <div class="spinner-border text-warning" style="width: 3rem; height: 3rem;" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
      
      <!-- Frame with Floating Download Button directly on Photo -->
      <div class="position-relative d-inline-block image-frame">
        <img [src]="images[currentIndex]" 
             alt="Full screen preview" 
             class="lightbox-image"
             [class.loaded]="!imageLoading"
             (load)="onImageLoad()">

        <!-- Floating download button directly on photo -->
        <button *ngIf="!imageLoading"
                class="btn-floating-download shadow-lg"
                (click)="downloadCurrent($event)"
                [disabled]="isDownloading"
                title="Download watermarked photo"
                aria-label="Download photo">
          <span *ngIf="isDownloading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          <i *ngIf="!isDownloading" class="bi bi-download me-2"></i>
          <span>{{ isDownloading ? 'Processing...' : 'Download' }}</span>
        </button>
      </div>
            
      <div class="lightbox-caption mt-3 text-white-50 small font-headings font-uppercase">
        <span *ngIf="title" class="text-white fw-bold me-2">{{ title }} — </span>
        Image {{ currentIndex + 1 }} of {{ images.length }}
      </div>
    </div>

    <!-- Next Button -->
    <button class="btn-nav btn-next" (click)="next()" aria-label="Next image">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>
</div>
